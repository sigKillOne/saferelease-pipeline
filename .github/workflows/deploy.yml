name: SafeRelease Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/saferelease-app:${{ github.sha }} .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/saferelease-app:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/saferelease-app:${{ github.sha }}
            
            OLD_CONTAINER=$(docker ps -q --filter "name=saferelease-app")
            
            docker run -d -p 3000:3000 --name saferelease-app-new ${{ secrets.DOCKER_USERNAME }}/saferelease-app:${{ github.sha }}
            
            sleep 10
            
            HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health)
            
            if [ "$HEALTH" = "200" ]; then
              echo "Health check passed! Switching to new version."
              if [ ! -z "$OLD_CONTAINER" ]; then
                docker stop $OLD_CONTAINER
                docker rm $OLD_CONTAINER
              fi
              docker rename saferelease-app-new saferelease-app
            else
              echo "Health check failed! Rolling back."
              docker stop saferelease-app-new
              docker rm saferelease-app-new
              if [ ! -z "$OLD_CONTAINER" ]; then
                docker start $OLD_CONTAINER
              fi
              exit 1
            fi
